<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- GitHub social-preview card, 1280x640 — the HUB's family layout (mark bars,
     big name, gradient rule, tagline, value chips, footer URL) over Noah's
     concept render, with the panel's own provenance tones as the mark:
     LIVE green, DERIVED cyan, STALE amber. Regenerate with
     `node scripts/render-social.mjs`; upload manually at
     GitHub repo -> Settings -> General -> Social preview (Doctrine §10). -->
<style>
  :root{
    --bg:#101010; --surface:rgba(34,34,36,.82); --line:#4a4a4e;
    --text:#f2f2f0; --muted:#b8b8b4;
    --live:#6ed194; --derived:#a5e9f8; --stale:#fadfa2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:640px}
  body{
    background:
      radial-gradient(900px 620px at 78% 38%, #1c2733 0%, rgba(20,26,32,0) 62%),
      linear-gradient(180deg, #141416, #0e0e10);
    color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 104px;position:relative;overflow:hidden;
  }
  /* The app's own icon — the ADI face — instead of the hub's mark bars.
     Noah's call: "I really like the icon." Its tile carries its own dark
     rounded background, so it sits on the scrim like an app on a shelf. */
  .mark{margin-bottom:30px}
  .mark img{width:116px;height:116px;display:block;border-radius:26px;
    box-shadow:0 8px 32px rgba(0,0,0,.55)}
  h1{font-size:84px;font-weight:660;letter-spacing:-0.025em;line-height:1.02}
  .rule{
    width:150px;height:7px;border-radius:7px;margin:30px 0 26px;
    background:linear-gradient(90deg,var(--live),var(--derived),var(--stale));
  }
  .tag{font-size:33px;color:var(--text);letter-spacing:0.005em;max-width:600px;line-height:1.3}
  .honest{font-size:22px;color:var(--muted);letter-spacing:0.04em;margin-top:16px}
  .values{display:flex;gap:14px;margin-top:40px}
  .vchip{
    font-size:24px;font-weight:600;letter-spacing:0.02em;
    color:var(--text);background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:13px 24px 13px 20px;
    display:inline-flex;align-items:center;gap:12px;
  }
  .vchip i{width:13px;height:13px;border-radius:50%;display:block}
  .foot{position:absolute;right:104px;bottom:56px;font-size:22px;color:var(--muted);letter-spacing:0.04em}
  /* The app's own artwork as the visual — the ADI face, large, floating on the
     right the way the panel floats in a cradle. Repo art, nothing borrowed. */
  .hero{position:absolute;right:88px;top:50%;transform:translateY(-54%) rotate(-4deg);
    width:380px;height:380px;border-radius:88px;
    box-shadow:0 28px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05)}
</style>
</head>
<body>
  <h1>fauxplane</h1>
  <div class="rule"></div>
  <p class="tag">A glass cockpit for your desk — airliner instruments from your device's own sensors and live aviation data.</p>
  <p class="honest">Not a simulator &middot; not certified for anything &middot; never for navigation</p>
  <div class="values">
    <span class="vchip"><i style="background:var(--live)"></i>Free</span>
    <span class="vchip"><i style="background:var(--derived)"></i>No account</span>
    <span class="vchip"><i style="background:var(--stale)"></i>Works offline</span>
  </div>
  <img class="hero" src="../public/icons/icon.svg" alt="">
  <div class="foot">fauxplane.pages.dev</div>
</body>
</html>
