<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="An attitude indicator: a round instrument face split by a horizon line, with the fixed aircraft symbol across it.">
  <title>fauxplane</title>
  <!--
    An attitude indicator, which is what a pilot recognises an instrument panel
    by. Checked against the audience's own vocabulary and not only against other
    logos (LESSONS 7c): an ADI face says "cockpit instrument", carries no
    unintended meaning, and reads at 32px because the horizon line and the
    aircraft symbol are the only two shapes in it.

    Wordless by design (Doctrine §3). Any lettering is overlaid later in real
    type, never drawn into the artwork.
  -->
  <rect width="512" height="512" rx="112" fill="#1a1a1a" />
  <clipPath id="face">
    <circle cx="256" cy="256" r="168" />
  </clipPath>
  <g clip-path="url(#face)">
    <!-- Banked 12 degrees, so the horizon reads as an attitude rather than as a
         dividing line in a logo. -->
    <g transform="rotate(-12 256 256)">
      <rect x="40" y="40" width="432" height="216" fill="#2f6087" />
      <rect x="40" y="256" width="432" height="216" fill="#5a3d22" />
      <rect x="40" y="248" width="432" height="16" fill="#eaeaea" />
      <g fill="#eaeaea">
        <rect x="196" y="186" width="120" height="9" rx="4" />
        <rect x="216" y="140" width="80" height="8" rx="4" />
        <rect x="196" y="318" width="120" height="9" rx="4" />
        <rect x="216" y="364" width="80" height="8" rx="4" />
      </g>
    </g>
  </g>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#c1c1c1" stroke-width="14" />
  <!-- The fixed aircraft symbol, amber over a dark outline — 4.15:1 on the sky
       and 6.14:1 on the ground, both clear of the 3:1 floor for a graphical
       object (WCAG 1.4.11). -->
  <g stroke-linecap="round" fill="none">
    <path d="M120 256 H206 V282 M392 256 H306 V282" stroke="#0b0b0b" stroke-width="40" />
    <path d="M120 256 H206 V282 M392 256 H306 V282" stroke="#ffc247" stroke-width="22" />
    <circle cx="256" cy="256" r="15" fill="#0b0b0b" stroke="none" />
    <circle cx="256" cy="256" r="8" fill="#ffc247" stroke="none" />
  </g>
</svg>
