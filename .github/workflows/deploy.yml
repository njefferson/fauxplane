name: Deploy

# staging -> a preview URL to open on a real device
# main    -> production
#
# Cloudflare Pages, deploying public/ plus the Pages Functions in functions/.
# Needs two repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# The project is created on first run if it does not exist, so there is no
# dashboard step before the first deploy.
#
# Actions are pinned BY SHA, not by tag (Doctrine §16.1) — a tag is a mutable
# pointer someone else controls, and these steps execute while holding a live
# Pages:Edit token.
#
# WHAT THIS GATE DOES AND DOES NOT RUN, stated plainly rather than implied:
# it runs the unit tests and the hub's privacy gate (Doctrine §9b).
# It does NOT run the accessibility gate, which needs a
# Chromium the runner would have to download; that gate is run locally before
# every push and its result is reported in the handoff. Claiming CI coverage it
# does not have would be the exact false-confidence failure Doctrine §4 records.

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # EVERY HUB GATE, CALLED RATHER THAN COPIED.
  #
  # These were three steps and a checkout inside the deploy job. Two things
  # changed besides where they live.
  #
  # THE HUB IS PINNED NOW. That checkout carried no `ref:` at all, so it took
  # whatever the hub's default branch happened to be at the moment the runner
  # ran — under a comment saying everything here is pinned by SHA because a tag
  # is a mutable pointer someone else controls. The action was pinned; the
  # repository it fetched was not, in the job that holds a live Cloudflare
  # token. The ref after the `@` below is a commit.
  #
  # AND IT IS THE WHOLE SET. This repo ran three of the hub's gates and there
  # are nine. docs-check, pin-check, pwa-check and third-person-check had never
  # run here; the last of those found fifty-odd sites on the day this was
  # wired, which is what a gate nobody runs is worth.
  hub-gates:
    uses: njefferson/noahjefferson/.github/workflows/hub-gates.yml@e2a5b7cb6b59311bdc7379abd0dea442edc8422f
    with:
      pwa: true
      zizmor: true

  # THE JOB THAT INSTALLS IS NOT THE JOB THAT HOLDS THE TOKEN, which is the
  # whole reason it is its own job. `actions/setup-node` restores a cache, and a
  # poisoned entry restored beside a live Pages:Edit token executes with it. It
  # used to sit in the deploy job with a written-out justification for why the
  # risk was small here; small is not the same as absent, and the structural fix
  # was available. MoleBridge has had this shape throughout.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # npm ci, never npm install: the committed lockfile is what pins what
      # executes on a runner (Doctrine §16.1).
      - name: Install tooling
        run: npm ci

      - name: Unit tests
        run: npm test

  deploy:
    # BOTH. The gates and the tests are separate jobs, so `needs:` is what keeps
    # them in front of the deploy. Without it they are parallel jobs the deploy
    # does not wait for.
    needs: [hub-gates, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Nothing in this job pushes, so the runner has no use for a git
          # credential — and leaving one in .git/config makes it available to
          # every later step in a job that goes on to hold a live Cloudflare
          # token. zizmor: artipacked; SECURITY.md threat #2.
          persist-credentials: false

      - name: Prepare Cloudflare credentials
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Strip any whitespace/newlines that sneak in when a secret is pasted.
          # A trailing newline corrupts the Authorization header (Cloudflare 6111).
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT"
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not set yet — skipping the deploy, not failing the run."
          fi
          # Doctrine §16.4: the cleaned values go to the job ENVIRONMENT, never
          # to step outputs. Outputs persist in the run's stored output and are
          # readable through the API; env is scoped to this job's steps. Only the
          # non-secret `ready` flag is an output.
          echo "CF_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CF_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Ensure the Pages project exists
        if: steps.cf.outputs.ready == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          command: pages project create fauxplane --production-branch=main

      # Run from the repo root so wrangler picks up functions/ alongside public/.
      # The three API endpoints are Pages Functions and are part of this deploy;
      # /api/metar and /api/winds need no credentials at all. /api/traffic needs
      # OPENSKY_CLIENT_ID, OPENSKY_CLIENT_SECRET and a KV binding named
      # FAUXPLANE_KV, and reports itself unconfigured on the BITE page until it
      # has them — which is correct, because no v1 panel consumes traffic.
      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          command: pages deploy public --project-name=fauxplane --branch=${{ github.ref_name }} --commit-dirty=true

      # THROUGH THE ENVIRONMENT, not interpolated into the shell. A branch name
      # is written by whoever can push a branch, and `${{ }}` expands into the
      # script BEFORE bash sees it — so a branch named to close the quote runs
      # commands here, in the job that holds a live Pages:Edit token. zizmor:
      # template-injection, twice, both High.
      - name: Where it landed
        if: steps.cf.outputs.ready == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "Production: https://fauxplane.pages.dev"
          else
            echo "Preview:    https://$BRANCH.fauxplane.pages.dev"
            echo "Staging is a hard gate — this does NOT reach production until it is promoted."
          fi
